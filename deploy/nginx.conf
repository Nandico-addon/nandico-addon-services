# Add inside the existing HTTPS server block for addon.nandico.in.
# Keep existing TLS certificate settings. No dashboard proxy is needed.
location = /outbox {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:3999;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Timestamp $http_x_timestamp;
    proxy_set_header X-Signature $http_x_signature;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
